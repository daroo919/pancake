<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팬케이크 드라이브 - 실험실 및 UI 설정</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50 to-yellow-100 min-h-screen text-gray-800 p-6 md:p-12">

    <div class="max-w-2xl mx-auto bg-white/95 backdrop-blur-md border border-amber-200 shadow-2xl rounded-3xl p-8 relative">
        
        <!-- 상단 헤더 -->
        <div class="flex justify-between items-center mb-8 pb-4 border-b border-amber-100">
            <div class="flex items-center space-x-3">
                <span id="header-mascot-icon" class="text-3xl">🥞</span>
                <div>
                    <h1 class="font-extrabold text-xl text-amber-950">스토어 실험실 & UI 설정</h1>
                    <p class="text-xs text-amber-800/70">독립된 설정 페이지에서 마음껏 텍스트와 용어를 커스텀해보세요!</p>
                </div>
            </div>
            <a href="index.html" class="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl text-xs font-bold transition">
                🏠 메인으로 돌아가기
            </a>
        </div>

        <form onsubmit="saveCustomSettings(event)" class="space-y-6">
            
            <!-- 1. 시그니처 마스코트 선택 -->
            <div class="bg-amber-50/60 p-5 rounded-2xl border border-amber-100">
                <label class="block text-xs font-bold text-amber-950 mb-2">🥞 스토어 시그니처 마스코트 선택</label>
                <p class="text-[11px] text-gray-500 mb-3">사이트 분위기를 바꿔줄 디저트 아이콘을 선택하세요.</p>
                <div class="flex gap-4">
                    <label class="flex items-center space-x-1.5 text-xs cursor-pointer bg-white px-3 py-2 rounded-xl border border-amber-200 shadow-xs">
                        <input type="radio" name="mascot" value="🥞" checked> <span>🥞 팬케이크</span>
                    </label>
                    <label class="flex items-center space-x-1.5 text-xs cursor-pointer bg-white px-3 py-2 rounded-xl border border-amber-200 shadow-xs">
                        <input type="radio" name="mascot" value="🧇"> <span>🧇 와플</span>
                    </label>
                    <label class="flex items-center space-x-1.5 text-xs cursor-pointer bg-white px-3 py-2 rounded-xl border border-amber-200 shadow-xs">
                        <input type="radio" name="mascot" value="🍩"> <span>🍩 도넛</span>
                    </label>
                    <label class="flex items-center space-x-1.5 text-xs cursor-pointer bg-white px-3 py-2 rounded-xl border border-amber-200 shadow-xs">
                        <input type="radio" name="mascot" value="🥐"> <span>🥐 크루아상</span>
                    </label>
                </div>
            </div>

            <!-- 2. 메인 UI 용어 직접 커스텀 -->
            <div class="bg-amber-50/60 p-5 rounded-2xl border border-amber-100">
                <label class="block text-xs font-bold text-amber-950 mb-2">✏️ 메인 화면 용어 커스텀 실험실</label>
                <p class="text-[11px] text-gray-500 mb-3">기본 문구를 원하시는 독특한 단어로 자유롭게 바꿔보세요. (예: "인기"를 "인기이"로!)</p>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-semibold text-gray-600 mb-1">메인 히어로 타이틀</label>
                        <input type="text" id="setting-hero-title" placeholder="예: 학생들의 반짝이는 인디 게임 창고" 
                               class="w-full px-3 py-2 rounded-xl bg-white border border-amber-200 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-gray-600 mb-1">인기 탭 버튼 이름</label>
                        <input type="text" id="setting-popular-tab" placeholder="예: 인기이" 
                               class="w-full px-3 py-2 rounded-xl bg-white border border-amber-200 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-gray-600 mb-1">메인 섹션 타이틀</label>
                        <input type="text" id="setting-section-title" placeholder="예: 🥞 갓 구워 나온 따끈따끈한 게임" 
                               class="w-full px-3 py-2 rounded-xl bg-white border border-amber-200 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
            </div>

            <!-- 3. 데이터 관리 영역 -->
            <div class="bg-red-50/60 p-5 rounded-2xl border border-red-100">
                <label class="block text-xs font-bold text-red-950 mb-2">🧹 설정 및 캐시 초기화</label>
                <p class="text-[11px] text-gray-500 mb-3">커스텀했던 설정값들을 기본값으로 되돌립니다.</p>
                <button type="button" onclick="resetSettings()" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl text-xs font-bold transition shadow-xs cursor-pointer">
                    ⚠️ 커스텀 설정 초기화하기
                </button>
            </div>

            <!-- 하단 버튼 -->
            <div class="pt-4 flex space-x-3">
                <a href="index.html" class="w-1/2 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold transition text-center">취소</a>
                <button type="submit" class="w-1/2 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition shadow-md cursor-pointer">설정 저장하기</button>
            </div>
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // 저장된 커스텀 텍스트 불러오기
            const customTexts = JSON.parse(localStorage.getItem('pancake_custom_texts')) || {};
            if (customTexts.heroTitle) document.getElementById('setting-hero-title').value = customTexts.heroTitle;
            if (customTexts.popularTab) document.getElementById('setting-popular-tab').value = customTexts.popularTab;
            if (customTexts.sectionTitle) document.getElementById('setting-section-title').value = customTexts.sectionTitle;

            const savedMascot = localStorage.getItem('pancake_mascot');
            if (savedMascot) {
                const radio = document.querySelector(`input[name="mascot"][value="${savedMascot}"]`);
                if (radio) radio.checked = true;
                document.getElementById('header-mascot-icon').textContent = savedMascot;
            }
        });

        function saveCustomSettings(event) {
            event.preventDefault();
            
            const heroTitle = document.getElementById('setting-hero-title').value.trim();
            const popularTab = document.getElementById('setting-popular-tab').value.trim();
            const sectionTitle = document.getElementById('setting-section-title').value.trim();
            const mascot = document.querySelector('input[name="mascot"]:checked').value;

            const customTexts = { heroTitle, popularTab, sectionTitle };
            localStorage.setItem('pancake_custom_texts', JSON.stringify(customTexts));
            localStorage.setItem('pancake_mascot', mascot);

            alert('✨ 설정이 성공적으로 저장되었습니다! 메인 화면에서 확인해 보세요.');
            window.location.href = 'index.html';
        }

        function resetSettings() {
            if (confirm('커스텀 설정을 초기화하시겠습니까?')) {
                localStorage.removeItem('pancake_custom_texts');
                localStorage.removeItem('pancake_mascot');
                alert('초기화되었습니다.');
                location.reload();
            }
        }
    </script>
</body>
</html>
